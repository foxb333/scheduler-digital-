<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Digital - Login</title>
    <link rel="stylesheet" href="design.css">
    <style>
        .topo-card { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .btn-tema-login { background: var(--bg-hover); border: 1px solid var(--border-main); color: var(--text-main); padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .erro-login { color: #ef4444; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body class="login-body">
    <script src="botão_tema.js"></script>

    <div class="login-card">
        <div class="topo-card">
            <button type="button" data-tema class="btn-tema-login" aria-label="Alternar tema claro/escuro">☀️ / 🌙 Tema</button>
        </div>

        <h2 class="login-title">Acessar Conta</h2>
        <p class="login-subtitle">Entre com suas credenciais (Acesso, CPF ou E-mail)</p>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email">E-mail, Acesso ou CPF</label>
                <input type="text" id="email" placeholder="Digite seu e-mail, acesso ou CPF" maxlength="50" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" maxlength="72" autocomplete="current-password" required>
            </div>

            <p id="errorMessage" class="erro-login" role="alert" hidden></p>

            <button type="submit" id="btnEntrar" class="btn-central btn-submit">Entrar no Sistema</button>
        </form>

        <div class="login-footer">
            <a href="index.html" class="back-link">← Voltar para o início</a>
        </div>
    </div>

    <script type="module">
        // @ts-nocheck  (avisa o VS Code para não mostrar alertas de tipo; não muda nada no funcionamento)
        import { supabase, loginInterno } from './config.js';

        const $ = id => document.getElementById(id);

        // Para onde cada tipo de conta vai depois de entrar (se mudar o nome de um arquivo, é só trocar aqui)
        const DESTINOS = {
            admin: 'admin-dashboard.html',
            diretor: 'diretores.html',
            professor: 'professores.html',
            gestao: 'professores.html',
            aluno: 'aluno.html'
        };

        const erro = msg => { const p = $('errorMessage'); p.textContent = msg ?? ''; p.hidden = !msg; };

        // O campo aceita: e-mail (administrador), CPF (professor, gestão e diretor) ou código de acesso (aluno).
        // A conversão para o login interno do Supabase está no config.js.
        $('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const idf = $('email').value.trim(), senha = $('password').value.trim();
            if (!idf || !senha) return erro('Preencha o usuário e a senha.');

            const btn = $('btnEntrar'), textoBtn = btn.textContent;
            btn.disabled = true; btn.textContent = 'Entrando...';
            try {
                const login = await loginInterno(idf);
                const { data, error } = await supabase.auth.signInWithPassword({ email: login.email, password: senha });
                if (error) {
                    const t = String(error.message || '');
                    if (/Failed to fetch|NetworkError|Load failed/i.test(t)) return erro('Sem conexão com o servidor. Verifique a internet e tente de novo.');
                    if (/rate limit|too many/i.test(t) || error.status === 429) return erro('Muitas tentativas. Espere alguns minutos e tente de novo.');
                    if (/captcha/i.test(t)) return erro('A proteção anti-robô do Supabase está ligada e o site ainda não a usa. Avise o administrador.');
                    erro('Credenciais incorretas!'); // mesma mensagem para usuário ou senha errados, de propósito
                    $('password').value = '';
                    return $('password').focus();
                }
                const destino = DESTINOS[data.user?.app_metadata?.cargo];
                if (!destino) {
                    await supabase.auth.signOut();
                    return erro('Esta conta não tem permissão de acesso. Fale com o administrador.');
                }

                // Liga a conta ao cadastro feito pelo admin (aluno ou equipe). Se o passo 8 do banco ainda não foi rodado, segue sem isso.
                if (data.user.app_metadata.cargo !== 'admin') {
                    const lig = await supabase.rpc('vincular_minha_conta');
                    if (!lig.error && lig.data === 'sem_cadastro') {
                        await supabase.auth.signOut();
                        return erro('Sua conta existe, mas o cadastro não foi encontrado. Fale com o administrador.');
                    }
                }
                location.href = destino;
            } catch (err) {
                console.error(err);
                erro('Não foi possível entrar agora. Tente de novo.');
            } finally {
                btn.disabled = false; btn.textContent = textoBtn;
            }
        });

        $('loginForm').addEventListener('input', () => erro(''));
    </script>
</body>
</html>
