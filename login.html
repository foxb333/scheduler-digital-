<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Digital - Login</title>
    <link rel="stylesheet" href="design.css">
</head>
<body class="login-body">

    <div class="login-card" style="position: relative;">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
            <button id="toggleTheme" onclick="alternarTema()" style="background: var(--bg-hover); border: 1px solid var(--border-main); color: var(--text-main); padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 13px;">
                ☀️ / 🌙 Tema
            </button>
        </div>

        <h2 class="login-title">Acessar Conta</h2>
        <p class="login-subtitle">Entre com suas credenciais (Acesso, CPF ou E-mail)</p>
        
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email">E-mail, Acesso ou CPF</label>
                <input type="text" id="email" placeholder="Digite seu e-mail, acesso ou CPF" maxlength="50" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" maxlength="25" required>
            </div>

            <p id="errorMessage" style="color: #ef4444; font-size: 13px; display: none; margin-bottom: 10px;">Credenciais incorretas!</p>

            <button type="submit" class="btn-central btn-submit">Entrar no Sistema</button>
        </form>

        <div class="login-footer">
            <a href="index.html" class="back-link">← Voltar para o início</a>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        function alternarTema() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const campoIdentificador = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMessage');

            // 1. Admin
            if (campoIdentificador === 'adm.com' && password === 'adm1234') {
                localStorage.setItem('usuarioLogado', JSON.stringify({ identificador: campoIdentificador, cargo: 'admin' }));
                window.location.href = 'admin-dashboard.html';
                return;
            }

            // 2. Professores, Gestão e Diretores
            const professoresCadastrados = JSON.parse(localStorage.getItem('professoresDB')) || [];
            const profEncontrado = professoresCadastrados.find(p => 
                (p.cpf === campoIdentificador || p.cpf.replace(/\D/g, '') === campoIdentificador.replace(/\D/g, '')) && p.senha === password
            );

            if (profEncontrado) {
                localStorage.setItem('usuarioLogado', JSON.stringify({ 
                    cpf: profEncontrado.cpf, 
                    nome: profEncontrado.nome,
                    permissao: profEncontrado.permissao, 
                    materia: profEncontrado.materia,
                    cargo: profEncontrado.permissao === 'diretores' ? 'diretor' : 'professor' 
                }));

                if (profEncontrado.permissao === 'diretores') {
                    window.location.href = 'diretores.html';
                } else {
                    window.location.href = 'professores.html';
                }
                return;
            }

            // 3. Alunos
            const alunosCadastrados = JSON.parse(localStorage.getItem('alunosDB')) || [];
            const alunoEncontrado = alunosCadastrados.find(aluno => 
                (aluno.email === campoIdentificador || aluno.matricula === campoIdentificador) && aluno.senha === password
            );

            if (alunoEncontrado) {
                localStorage.setItem('usuarioLogado', JSON.stringify({ email: campoIdentificador, nome: alunoEncontrado.nome, cargo: 'aluno' }));
                window.location.href = 'dashboard.html';
                return;
            }

            errorMsg.style.display = 'block';
        });
    </script>
</body>
</html>
