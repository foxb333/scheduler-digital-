<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Digital - Login</title>
    <link rel="stylesheet" href="design.css">
</head>
<body class="login-body">

    <!-- CARD DE LOGIN CENTRALIZADO -->
    <div class="login-card" style="position: relative;">
        
        <!-- Botão de Tema no topo do card -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
            <button id="toggleTheme" onclick="alternarTema()" style="background: var(--bg-hover); border: 1px solid var(--border-main); color: var(--text-main); padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 13px;">
                ☀️ / 🌙 Tema
            </button>
        </div>

        <h2 class="login-title">Acessar Conta</h2>
        <p class="login-subtitle">Entre com suas credenciais</p>
        
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email">E-mail ou Matrícula</label>
                <input type="text" id="email" placeholder="ex: 0000110949562" maxlength="25" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" maxlength="25" required>
            </div>

            <p id="errorMessage" style="color: #ef4444; font-size: 13px; display: none; margin-bottom: 10px;">E-mail ou senha incorretos!</p>

            <button type="submit" class="btn-central btn-submit">Entrar no Sistema</button>
        </form>

        <div class="login-footer">
            <a href="index.html" class="back-link">← Voltar para o início</a>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA DE TEMA E AUTENTICAÇÃO -->
    <script>
        // 1. Aplica o tema salvo (claro ou escuro) ao carregar a página
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // Função para alternar o tema com o botão
        function alternarTema() {
            document.body.classList.toggle('light-mode');
            
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }

        // 2. Lógica de Autenticação
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMessage');

            // Validação da conta Admin (adm.com / adm1234)
            if (email === 'adm.com' && password === 'adm1234') {
                localStorage.setItem('usuarioLogado', JSON.stringify({ email: email, cargo: 'admin' }));
                window.location.href = 'admin-dashboard.html';
                return;
            }

            // Validação de Alunos cadastrados via localStorage
            const alunosCadastrados = JSON.parse(localStorage.getItem('alunosDB')) || [];
            const alunoEncontrado = alunosCadastrados.find(aluno => 
                (aluno.email === email || aluno.matricula === email) && aluno.senha === password
            );

            if (alunoEncontrado) {
                localStorage.setItem('usuarioLogado', JSON.stringify({ email: email, nome: alunoEncontrado.nome, cargo: 'aluno' }));
                window.location.href = 'dashboard.html';
                return;
            }

            // Exibe mensagem de erro se a conta não existir
            errorMsg.style.display = 'block';
        });
    </script>
</body>
</html>
