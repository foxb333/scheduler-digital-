<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Digital - Login</title>
    <link rel="stylesheet" href="design.css">
    <style>
        .topo-card { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .btn-tema-login { background: var(--bg-hover); border: 1px solid var(--border-main); color: var(--text-main); padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .erro-login { color: #ef4444; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body class="login-body">
    <script src="botão_de_tema.js"></script>

    <div class="login-card">
        <div class="topo-card">
            <button type="button" data-tema class="btn-tema-login" aria-label="Alternar tema claro/escuro">☀️ / 🌙 Tema</button>
        </div>

        <h2 class="login-title">Acessar Conta</h2>
        <p class="login-subtitle">Entre com suas credenciais (Acesso, CPF ou E-mail)</p>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email">E-mail, Acesso ou CPF</label>
                <input type="text" id="email" placeholder="Digite seu e-mail, acesso ou CPF" maxlength="50" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" maxlength="25" autocomplete="current-password" required>
            </div>

            <p id="errorMessage" class="erro-login" role="alert" hidden></p>

            <button type="submit" class="btn-central btn-submit">Entrar no Sistema</button>
        </form>

        <div class="login-footer">
            <a href="index.html" class="back-link">← Voltar para o início</a>
        </div>
    </div>

    <script type="module">
        const $ = id => document.getElementById(id);
        const ler = k => { try { const l = JSON.parse(localStorage.getItem(k)); return Array.isArray(l) ? l : []; } catch { return []; } };
        const norm = s => String(s ?? '').trim().toLowerCase();
        const soDigitos = s => String(s ?? '').replace(/\D/g, '');

        const ADMIN = { acesso: 'adm.com', senha: 'adm1234' };
        const DESTINOS = { admin: 'admin-dashboard.html', diretor: 'diretores.html', professor: 'professores.html', aluno: 'dashboard.html' };

        // Devolve os dados da sessão se as credenciais baterem, ou null
        function autenticar(idf, senha) {
            const chave = norm(idf);

            // 1. Admin
            if (chave === ADMIN.acesso && senha === ADMIN.senha) return { identificador: idf, cargo: 'admin' };

            // 2. Professores, Gestão e Diretores (por CPF; só compara se o texto parece um CPF)
            const cpf = /^[\d.\-\s]+$/.test(idf) ? soDigitos(idf) : '';
            const prof = cpf && ler('professoresDB').find(p => soDigitos(p.cpf) === cpf && p.senha === senha);
            if (prof) return {
                id: prof.id, cpf: prof.cpf, nome: prof.nome, permissao: prof.permissao, materia: prof.materia,
                cargo: prof.permissao === 'diretores' ? 'diretor' : 'professor'
            };

            // 3. Alunos (por acesso ou matrícula, sem diferenciar maiúsculas)
            const aluno = ler('alunosDB').find(a => (norm(a.email) === chave || norm(a.matricula) === chave) && a.senha === senha);
            return aluno ? { id: aluno.id, email: aluno.email, nome: aluno.nome, cargo: 'aluno' } : null;
        }

        const erro = msg => { const p = $('errorMessage'); p.textContent = msg ?? ''; p.hidden = !msg; };

        $('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            const sessao = autenticar($('email').value.trim(), $('password').value.trim());
            if (!sessao) {
                erro('Credenciais incorretas!');
                $('password').value = '';
                return $('password').focus();
            }
            try { localStorage.setItem('usuarioLogado', JSON.stringify(sessao)); }
            catch { return erro('Não foi possível iniciar a sessão: o armazenamento do navegador está bloqueado.'); }
            location.href = DESTINOS[sessao.cargo];
        });

        $('loginForm').addEventListener('input', () => erro(''));
    </script>
</body>
</html>
