<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Digital - Agenda Infinita</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <!-- BARRA SUPERIOR (NAVBAR) -->
    <header class="navbar">
        <a href="index.html" class="brand">Schedule Digital</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-btn">Início</a>
            <a href="login.html" class="btn-auth btn-login">Entrar</a>
            <a href="criadores.html" class="nav-btn">Criadores</a>
        </nav>
    </header>

    <!-- CONTAINER CENTRAL DA AGENDA -->
    <main class="agenda-wrapper">
        <div class="calendario-card grande">
            <div class="calendar-header">
                <!-- Nome do Mês e Ano -->
                <h3 id="monthYear"></h3>
                <div class="calendar-nav">
                    <button class="nav-arrow" id="prevMonth" aria-label="Mês Anterior">&lt;</button>
                    <button class="nav-arrow" id="nextMonth" aria-label="Próximo Mês">&gt;</button>
                </div>
            </div>

            <!-- TABELA DO CALENDÁRIO -->
            <table class="calendar-table">
                <thead>
                    <tr>
                        <th>Dom</th>
                        <th>Seg</th>
                        <th>Ter</th>
                        <th>Qua</th>
                        <th>Qui</th>
                        <th>Sex</th>
                        <th>Sáb</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- Gerado dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </main>
    

    <!-- RODAPÉ -->
    <footer class="footer">
        <p>© 2026 <span class="schedule-brand">Schedule Digital</span>. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DO CALENDÁRIO -->
    <script src="calendar.js"></script>
</body>
</html>
