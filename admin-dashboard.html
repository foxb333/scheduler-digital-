<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Schedule Digital</title>
    <link rel="stylesheet" href="design.css">
    <style>
        /* Ajustes de responsividade para o painel administrativo */
        @media screen and (max-width: 768px) {
            body.dashboard-body {
                flex-direction: column !important;
                display: flex !important;
            }
            .sidebar {
                width: 100% !important;
                height: auto !important;
                position: relative !important;
            }
            .dashboard-content {
                margin-left: 0 !important;
                padding: 15px !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- BARRA LATERAL ADMIN -->
    <aside class="sidebar">
        <div>
            <h2 class="sidebar-brand">Schedule <span style="font-size: 12px; color: #ef4444;">[ADMIN]</span></h2>
            <nav class="sidebar-menu" style="margin-top: 25px;">
                <p style="color: #60a5fa; font-weight: 600;">Gestão de Alunos</p>
            </nav>
        </div>
        <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Botão de Tema na Sidebar Admin -->
            <button id="toggleTheme" onclick="alternarTema()" class="btn-logout" style="background: var(--bg-hover); border: 1px solid var(--border-main); color: var(--text-main); text-align: center; cursor: pointer;">
                ☀️ / 🌙 Tema
            </button>
            <button onclick="logout()" class="btn-logout" style="background: none; border: none; cursor: pointer; text-align: left;">Sair da Conta</button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="dashboard-content">
        <header class="dashboard-header">
            <h1>Painel de Controle Administrativo</h1>
            <p>Cadastre e gerencie as contas de acesso dos estudantes.</p>
        </header>

        <!-- FORMULÁRIO DE CADASTRO CENTRALIZADO -->
        <section class="admin-section" style="display: flex; justify-content: center; width: 100%;">
            <div class="login-card" style="max-width: 600px; width: 100%; padding: 25px; box-sizing: border-box;">
                <h3 style="margin-bottom: 15px; color: #60a5fa;">Cadastrar Novo Aluno</h3>
                <form id="cadastrarAlunoForm" class="login-form">
                    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Nome Completo</label>
                            <input type="text" id="novoNome" placeholder="Ex: Ana Souza" required>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>E-mail de Acesso</label>
                            <input type="text" id="novoEmail" placeholder="00001105939352sp" required>
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;">
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Matrícula</label>
                            <input type="text" id="novaMatricula" placeholder="2026001" required>
                        </div>
                        <div class="input-group" style="flex: 1; min-width: 200px;">
                            <label>Senha Provisória</label>
                            <input type="password" id="novaSenha" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-central" style="max-width: 200px; width: 100%; margin-top: 15px;">Cadastrar Aluno</button>
                </form>
            </div>
        </section>

        <!-- TABELA DE ALUNOS CADASTRADOS -->
        <section style="margin-top: 40px;">
            <h3 style="margin-bottom: 15px;">Alunos Registrados</h3>
            <div style="overflow-x: auto; width: 100%;">
                <table style="width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; overflow: hidden; text-align: left; min-width: 500px;">
                    <thead>
                        <tr style="background: rgba(37, 99, 235, 0.2); color: #60a5fa; border-bottom: 1px solid var(--border-main);">
                            <th style="padding: 12px 15px;">Nome</th>
                            <th style="padding: 12px 15px;">E-mail</th>
                            <th style="padding: 12px 15px;">Matrícula</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAlunos">
                        <!-- Linhas inseridas via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // 1. Aplica o tema salvo imediatamente ao carregar
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // Função para alternar entre claro e escuro
        function alternarTema() {
            document.body.classList.toggle('light-mode');
            
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }

        // Trava de segurança: Garante que apenas a conta ADMIN acessa esta página
        const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
        if (!usuario || usuario.cargo !== 'admin') {
            window.location.href = 'login.html';
        }

        // Função para atualizar a tabela na tela
        function carregarTabela() {
            const alunos = JSON.parse(localStorage.getItem('alunosDB')) || [];
            const tbody = document.getElementById('tabelaAlunos');
            tbody.innerHTML = '';

            alunos.forEach(aluno => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border-main)';
                tr.innerHTML = `
                    <td style="padding: 12px 15px; color: var(--text-main);">${aluno.nome}</td>
                    <td style="padding: 12px 15px; color: var(--text-main);">${aluno.email}</td>
                    <td style="padding: 12px 15px; color: var(--text-main);">${aluno.matricula}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Salvar novo aluno no localStorage
        document.getElementById('cadastrarAlunoForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const novoAluno = {
                nome: document.getElementById('novoNome').value,
                email: document.getElementById('novoEmail').value,
                matricula: document.getElementById('novaMatricula').value,
                senha: document.getElementById('novaSenha').value
            };

            const alunos = JSON.parse(localStorage.getItem('alunosDB')) || [];
            alunos.push(novoAluno);
            localStorage.setItem('alunosDB', JSON.stringify(alunos));

            this.reset();
            carregarTabela();
            alert('Aluno cadastrado com sucesso,');
        });

        function logout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }

        // Carrega os alunos salvos ao abrir a página
        carregarTabela();
    </script>
</body>
</html>
